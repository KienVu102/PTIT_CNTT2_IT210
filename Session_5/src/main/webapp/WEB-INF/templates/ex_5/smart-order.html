<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Hóa Đơn Thông Minh</title>
    <style>
        .order-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .invoice-header { border-bottom: 2px dashed #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .item-list { width: 100%; text-align: left; margin-bottom: 20px; }
        .summary { text-align: right; font-size: 16px; }
        .total-price { color: #d9534f; font-size: 24px; font-weight: bold; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>

<div layout:fragment="content">

    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}">
        Dữ liệu mẫu: Đã xảy ra lỗi không xác định!
    </div>

    <div class="order-card" th:unless="${errorMessage}">

        <div class="invoice-header">
            <h2>CHI TIẾT ĐƠN HÀNG</h2>
            <p>Khách hàng: <strong th:text="${order.customerName}">Nguyễn Văn A</strong></p>
            <p>Mã HĐ: <span th:text="${order.orderId}">ORD-999</span></p>
        </div>

        <table class="item-list">
            <tr th:each="item : ${order.items}">
                <td th:text="${item.name}">Tên món mẫu (Mock)</td>
                <td style="text-align: right;" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">100,000 đ</td>
            </tr>
        </table>

        <div class="summary">
            <p>Tạm tính: <span th:text="${#numbers.formatDecimal(order.subTotal, 0, 'COMMA', 0, 'POINT')}">100,000</span> đ</p>
            <p>Thuế VAT (10%): <span th:text="${#numbers.formatDecimal(order.taxAmount, 0, 'COMMA', 0, 'POINT')}">10,000</span> đ</p>
            <hr>
            <p>TỔNG THANH TOÁN: <span class="total-price" th:text="${#numbers.formatDecimal(order.grandTotal, 0, 'COMMA', 0, 'POINT')}">110,000</span> đ</p>
        </div>

    </div>
</div>

</body>
</html>
