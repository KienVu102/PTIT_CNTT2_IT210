<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chỉnh Sửa Món Ăn</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .form-container { width: 400px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .form-group input[type="text"], .form-group input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
    .btn-submit { background-color: #28a745; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; width: 100%; }
    .btn-back { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #007bff; }
  </style>
</head>
<body>

<h2 style="text-align: center;">📝 CHỈNH SỬA THÔNG TIN</h2>

<div class="form-container">
  <form th:action="@{/bai3/update}" th:object="${dish}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
      <label>Tên món ăn:</label>
      <input type="text" th:field="*{name}" required/>
    </div>

    <div class="form-group">
      <label>Giá (VNĐ):</label>
      <input type="number" th:field="*{price}" required/>
    </div>

    <div class="form-group">
      <label>Trạng thái:</label>
      <input type="checkbox" th:field="*{available}" /> Còn hàng
    </div>

    <button type="submit" class="btn-submit">Lưu Thay Đổi (Chưa làm ở bài này)</button>
    <a th:href="@{/bai3/dishes}" class="btn-back">Quay lại danh sách</a>
  </form>
</div>

</body>
</html>
